<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emin Baycan</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
        }
        h1 { margin-bottom: 10px; font-size: 28px; color: #38bdf8; }
        p { color: #94a3b8; font-size: 16px; line-height: 1.6; }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #0284c7;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
        .btn:hover { background-color: #0369a1; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Emin Baycan</h1>
        <p>Web sitemiz çok yakında hizmetinizde olacaktır.</p>
        <a href="mailto:resmi@eminbaycan.com" class="btn">İletişime Geç</a>
    </div>
</body>
</html>
