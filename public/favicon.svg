<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .pulse { animation: pulse 2s infinite; }
    .spin-1 { animation: spin 4s linear infinite; transform-origin: center; }
    .spin-2 { animation: spin 5s linear infinite reverse; transform-origin: center; }
    .spin-3 { animation: spin 6s linear infinite; transform-origin: center; }
    .spin-4 { animation: spin 4.5s linear infinite reverse; transform-origin: center; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
  <circle cx="12" cy="12" r="3" fill="#000" class="pulse" />
  <g class="spin-1">
    <circle cx="12" cy="4" r="1.5" fill="#000" />
    <line x1="12" y1="5.5" x2="12" y2="9" stroke="#000" stroke-width="1.5" stroke-linecap="round" />
  </g>
  <g class="spin-2">
    <circle cx="20" cy="12" r="1.5" fill="#000" />
    <line x1="18.5" y1="12" x2="15" y2="12" stroke="#000" stroke-width="1.5" stroke-linecap="round" />
  </g>
  <g class="spin-3">
    <circle cx="4" cy="12" r="1.5" fill="#000" />
    <line x1="5.5" y1="12" x2="9" y2="12" stroke="#000" stroke-width="1.5" stroke-linecap="round" />
  </g>
  <g class="spin-4">
    <circle cx="12" cy="20" r="1.5" fill="#000" />
    <line x1="12" y1="18.5" x2="12" y2="15" stroke="#000" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>
